<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard User - Desa Kalemago</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="common-stats.js" defer></script>
</head>
<body class="bg-gray-100">
  <nav class="bg-emerald-800 text-white shadow-lg sticky top-0 z-50 px-6">
    <div class="py-4">
      <div class="flex items-center justify-between max-w-7xl mx-auto">
        <div class="flex items-center gap-4">
          <img src="fotokkn/logokabposo.png" alt="Logo" class="w-14 h-14 object-contain">
          <div>
            <h1 class="font-bold text-2xl">Dashboard User</h1>
            <p class="text-emerald-300 text-sm">Desa Kalemago</p>
          </div>
        </div>
        
        <div class="flex items-center gap-4">
          <div class="text-right hidden md:block">
            <p class="font-semibold" id="userName">Loading...</p>
            <p class="text-emerald-300 text-xs" id="userRole">USER</p>
          </div>
          <button onclick="logout()" class="bg-emerald-700 hover:bg-red-600 px-5 py-2.5 rounded-2xl text-sm font-medium transition flex items-center gap-2">
            <i class="fas fa-sign-out-alt"></i>
            <span class="hidden md:inline">Logout</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-6 py-8">
    <div class="bg-gradient-to-r from-emerald-700 to-emerald-600 rounded-3xl p-8 text-white mb-8 shadow-xl">
      <h2 class="text-4xl font-bold mb-2">Selamat Datang! 👋</h2>
      <p class="text-emerald-200 text-lg" id="welcomeMessage">Memuat...</p>
    </div>

  </div>

  <script>
    const API_URL = 'https://desakalemago2-backend-production.up.railway.app';

    async function checkAuth() {
      const userStr = localStorage.getItem('user');
      if (!userStr) { window.location.href = 'login.html'; return; }
      
      const user = JSON.parse(userStr);
      
      if (user.role === 'admin') { window.location.href = 'admin-dashboard.html'; return; }
      if (user.role === 'developer') { window.location.href = 'developer-dashboard.html'; return; }
      
      document.getElementById('userName').textContent = user.name || user.username;
      document.getElementById('welcomeMessage').textContent = `Halo, ${user.name || user.username}!`;
    }

    // (Fitur Lihat Kartu Keluarga telah dihapus sesuai permintaan)

    function logout() {
      if (confirm('Yakin ingin logout?')) {
        // Kurangi jumlah user aktif
        let active = parseInt(localStorage.getItem('dk_activeUsers') || '3');
        localStorage.setItem('dk_activeUsers', Math.max(1, active - 1));

        localStorage.removeItem('user');
        window.location.href = 'login.html';
      }
    }

    checkAuth();
  </script>
</body>
</html>
