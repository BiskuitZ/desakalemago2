---
layout: null
---
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - Desa Kalemago</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100">
  <nav class="bg-emerald-800 text-white shadow-lg sticky top-0 z-50 px-6">
    <div class="py-4">
      <div class="flex items-center justify-between max-w-7xl mx-auto">
        <div class="flex items-center gap-4">
          <img src="fotokkn/logokabposo.png" alt="Logo" class="w-14 h-14 object-contain">
          <div>
            <h1 class="font-bold text-2xl">Dashboard Admin</h1>
            <p class="text-emerald-300 text-sm">Desa Kalemago</p>
          </div>
        </div>
        
        <div class="flex items-center gap-4">
          <div class="text-right hidden md:block">
            <p class="font-semibold" id="userName">Loading...</p>
            <p class="text-emerald-300 text-xs" id="userRole">ADMIN</p>
          </div>
          <button onclick="logout()" class="bg-emerald-700 hover:bg-red-600 px-5 py-2.5 rounded-2xl text-sm font-medium transition flex items-center gap-2">
            <i class="fas fa-sign-out-alt"></i>
            <span class="hidden md:inline">Logout</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-6 py-8">
    <div class="bg-gradient-to-r from-emerald-700 to-emerald-600 rounded-3xl p-8 text-white mb-8 shadow-xl">
      <h2 class="text-4xl font-bold mb-2">Selamat Datang Admin! 👋</h2>
      <p class="text-emerald-200 text-lg" id="welcomeMessage">Memuat...</p>
    </div>

    <div class="bg-white rounded-3xl shadow-lg p-8">
      <h3 class="text-2xl font-bold text-emerald-800 mb-6 flex items-center gap-3">
        <i class="fas fa-cloud-sun text-emerald-600"></i>
        Cuaca Desa Kalemago
      </h3>
      
      <div class="grid md:grid-cols-2 gap-6">
        <div class="bg-gradient-to-br from-blue-500 to-blue-600 rounded-2xl p-8 text-white">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-7xl font-extrabold" id="dashTemp">28°C</p>
              <p class="text-xl" id="dashWeather">Cerah Berawan</p>
            </div>
            <i class="fas fa-cloud-sun text-8xl opacity-50"></i>
          </div>
        </div>
        
        <div class="space-y-4">
          <div class="flex items-center gap-4 bg-gray-50 rounded-xl p-4">
            <i class="fas fa-wind text-2xl text-emerald-600 w-8"></i>
            <div><p class="text-sm text-gray-500">Kecepatan Angin</p><p class="font-semibold" id="dashWind">5 km/j</p></div>
          </div>
          <div class="flex items-center gap-4 bg-gray-50 rounded-xl p-4">
            <i class="fas fa-tint text-2xl text-emerald-600 w-8"></i>
            <div><p class="text-sm text-gray-500">Kelembaban</p><p class="font-semibold" id="dashHumidity">85%</p></div>
          </div>
          <div class="flex items-center gap-4 bg-gray-50 rounded-xl p-4">
            <i class="fas fa-eye text-2xl text-emerald-600 w-8"></i>
            <div><p class="text-sm text-gray-500">Jarak Pandang</p><p class="font-semibold" id="dashVisibility">10 km</p></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://desakalemago2-backend-production.up.railway.app';

    async function checkAuth() {
      const userStr = localStorage.getItem('user');
      if (!userStr) { window.location.href = 'login.html'; return; }
      
      const user = JSON.parse(userStr);
      
      if (user.role === 'user') { window.location.href = 'user-dashboard.html'; return; }
      if (user.role === 'developer') { window.location.href = 'developer-dashboard.html'; return; }
      
      document.getElementById('userName').textContent = user.name || user.username;
      document.getElementById('welcomeMessage').textContent = `Halo Admin, ${user.name || user.username}!`;
      
      await loadWeather();
    }

    async function loadWeather() {
      try {
        const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-1.5123&longitude=120.4300&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m,visibility');
        const data = await response.json();
        const current = data.current;
        
        document.getElementById('dashTemp').textContent = Math.round(current.temperature_2m) + '°C';
        const weatherCodes = { 0: 'Cerah', 1: 'Cerah Berawan', 2: 'Berawan Sebagian', 3: 'Berawan', 45: 'Berkabut', 61: 'Hujan Ringan', 63: 'Hujan Sedang', 80: 'Hujan Ringan' };
        document.getElementById('dashWeather').textContent = weatherCodes[current.weather_code] || 'Berawan';
        document.getElementById('dashWind').textContent = Math.round(current.wind_speed_10m) + ' km/j';
        document.getElementById('dashHumidity').textContent = current.relative_humidity_2m + '%';
        document.getElementById('dashVisibility').textContent = Math.round((current.visibility || 10000) / 1000) + ' km';
      } catch (err) {}
    }

    function logout() {
      if (confirm('Yakin ingin logout?')) {
        localStorage.removeItem('user');
        window.location.href = 'login.html';
      }
    }

    checkAuth();
    
    // Auto-refresh every 30 seconds
    setInterval(() => {
      loadWeather();
    }, 30000);
  </script>
</body>
</html>
